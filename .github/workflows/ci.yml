name: ROS 2 CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test (ROS 2 Humble)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup ROS 2 Humble
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: humble

      - name: Install System Build Tools & Linkers
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            lld \
            cmake \
            build-essential \
            git \
            python3-colcon-common-extensions \
            python3-rosdep \
            python3-vcstool

      - name: Install YDLidar-SDK
        run: |
          git clone --depth 1 https://github.com/YDLIDAR/YDLidar-SDK.git /tmp/YDLidar-SDK
          mkdir -p /tmp/YDLidar-SDK/build
          cd /tmp/YDLidar-SDK/build
          cmake ..
          make -j$(nproc)
          sudo make install
          sudo ldconfig

      - name: Install ROS 2 Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ros-humble-tf2-ros \
            ros-humble-tf2-geometry-msgs \
            ros-humble-message-filters \
            ros-humble-nav-msgs \
            ros-humble-sensor-msgs \
            ros-humble-visualization-msgs \
            ros-humble-angles \
            ros-humble-realtime-tools \
            ros-humble-control-toolbox \
            ros-humble-xacro \
            ros-humble-generate-parameter-library \
            ros-humble-joint-state-broadcaster \
            ros-humble-diff-drive-controller \
            ros-humble-dynamixel-sdk \
            ros-humble-nav2-map-server || true

      - name: Initialize & Update rosdep
        run: |
          sudo rosdep init || true
          rosdep update
          rosdep install -i --from-path src --rosdistro humble -y --skip-keys="ydlidar_sdk" || true

      - name: Build Core Robot & SLAM Packages
        run: |
          source /opt/ros/humble/setup.bash
          colcon build --symlink-install --event-handlers console_direct+ --packages-up-to my_robot ydlidar_ros2_driver slam_gmapping

      - name: Build Remaining Workspace Packages
        run: |
          source /opt/ros/humble/setup.bash
          colcon build --symlink-install --event-handlers console_direct+ --continue-on-error || true

      - name: Run Colcon Tests on Core Packages
        run: |
          source /opt/ros/humble/setup.bash
          colcon test --packages-select my_robot ydlidar_ros2_driver slam_gmapping --event-handlers console_direct+ || true
          colcon test-result --verbose || true
